[package]
name = "simplelogin-smtp-relay"
version = "0.1.0"
edition = "2021"
description = "Rust reimplementation of Hoshinowo-Yuki/simple-login-smtp-relay"
license = "MIT"

[[bin]]
name = "smtp-relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-native-tls = "0.3.1"
native-tls = { version = "0.2.18", features = ["vendored"] }
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
reqwest = { version = "0.13.5", features = ["json", "blocking", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
mailparse = "0.18.0"
base64 = "0.23.1"
log = "0.4.35"
env_logger = "0.11.11"
chrono = "0.4.45"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
anyhow = "1.0.104"
once_cell = "1.21.4"

[dev-dependencies]
tempfile = "3.27.0"
