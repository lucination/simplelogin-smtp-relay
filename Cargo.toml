[package]
name = "simplelogin-smtp-relay"
version = "0.1.0"
edition = "2021"
description = "Rust reimplementation of Hoshinowo-Yuki/simple-login-smtp-relay"
license = "MIT"

[[bin]]
name = "smtp-relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-native-tls = "0.3"
native-tls = { version = "0.2", features = ["vendored"] }
rustls = "0.23"
rustls-pemfile = "2"
reqwest = { version = "0.13", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mailparse = "0.16"
base64 = "0.23"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
anyhow = "1"
once_cell = "1"

[dev-dependencies]
tempfile = "3"
