# Auto-merge Dependabot PRs once CI is green. This is the pattern from
# GitHub's official "Automating Dependabot with GitHub Actions" tutorial:
# run on pull_request_target, act ONLY when the PR author is
# dependabot[bot], then enable auto-merge. Auto-merge itself waits for all
# status checks (build-and-test: fmt + check + test) to pass before merging.
#
# No approval step: GitHub forbids the Actions token from approving PRs
# ("GitHub Actions is not permitted to approve pull requests"), and this
# repo has no branch protection requiring reviews anyway.
#
# Security notes (kept fail-closed):
# - pull_request_target runs with the base branch's token; we never check
#   out or execute PR code, so a malicious PR cannot inject steps. The only
#   action is a gh CLI call against the API.
# - The author guard (github.event.pull_request.user.login ==
#   'dependabot[bot]') is mandatory: it must never be relaxed to labels or
#   titles, which are user-controlled.
# - GITHUB_TOKEN has no access to repo secrets, so nothing here can leak them.
#
# Requires the repo setting "Allow auto-merge" (enabled via API when this
# file was added). Crate and base-image bumps are validated by CI before
# merge; the docker image build jobs intentionally run only on push to main,
# so a bad base-image bump surfaces as a failed post-merge run while the
# previous image tags remain untouched.
name: Dependabot auto-merge

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch the post-merge CI rebuild

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub does not fire push events for merge commits attributed to
      # Dependabot, so the merged result would otherwise never trigger the
      # image rebuild. Wait for the merge to land, then dispatch CI on main
      # explicitly. The weekly schedule remains the backstop if anything here
      # fails.
      - name: Wait for auto-merge
        run: |
          for i in $(seq 1 90); do
            state="$(gh pr view "$PR_URL" --json state --jq .state)"
            [ "$state" = "MERGED" ] && exit 0
            sleep 20
          done
          echo "PR did not merge within 30 minutes; the weekly schedule will pick up the rebuild." >&2
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch post-merge rebuild
        run: gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
